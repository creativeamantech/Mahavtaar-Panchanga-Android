name: Android and Shared Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mahavtaar-panchanga-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned TypeScript golden references
        uses: actions/checkout@v4
        with:
          repository: creativeamantech/mahavtaarpanchanga
          ref: 088035ddea6c9757f09e77fb4f30bd2657ef2d32
          path: reference-source
      - name: Validate immutable reference corpus
        run: python scripts/validate_reference_corpus.py reference-source/reference/panchanga/v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Run Kotlin Multiplatform JVM tests
        run: gradle :shared:jvmTest
      - name: Compile JavaScript target
        run: gradle :shared:compileKotlinJs

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mahavtaar-panchanga-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
